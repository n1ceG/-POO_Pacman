 almacenadas; las dependencias principales y los tipos enum se dibujan con línea discontinua. Los demás usos de tipos se conservan en las firmas para no saturar el gráfico."}, {"id": "R01", "title": "R01 · Movimiento", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1900\" height=\"2014\" viewBox=\"0 0 1900 2014\" role=\"img\" aria-label=\"R01 - Movimiento\">\n<defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#334155\"/><\/marker><marker id=\"open\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"9\" markerHeight=\"9\" orient=\"auto-start-reverse\"><path d=\"M1 1L11 6L1 11\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"1.5\"/><\/marker><marker id=\"triangle\" viewBox=\"0 0 14 14\" refX=\"13\" refY=\"7\" markerWidth=\"15\" markerHeight=\"15\" orient=\"auto-start-reverse\"><path d=\"M1 1L13 7L1 13Z\" fill=\"white\" stroke=\"#334155\"/><\/marker><marker id=\"diamond\" viewBox=\"0 0 18 12\" refX=\"1\" refY=\"6\" markerWidth=\"18\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L9 1L17 6L9 11Z\" fill=\"#334155\" stroke=\"#334155\"/><\/marker><\/defs>\n<rect width=\"1900\" height=\"2014\" fill=\"#ffffff\"/>\n<g font-family=\"Arial, sans-serif\" fill=\"#0f172a\">\n<text x=\"40\" y=\"46\" font-size=\"27\" font-weight=\"bold\">R01 · MOVIMIENTO<\/text>\n<text x=\"40\" y=\"80\" font-size=\"16\" fill=\"#475569\">Llamadas reales del código · notas para asignaciones y partes omitidas · lectura de arriba hacia abajo<\/text>\n<rect x=\"45\" y=\"120\" width=\"270\" height=\"52\" rx=\"4\" fill=\"#e0f2fe\" stroke=\"#334155\"/>\n<text x=\"180\" y=\"152\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"bold\">vista:JuegoConsola<\/text>\n<path d=\"M180 172V1959\" stroke=\"#94a3b8\" stroke-dasharray=\"7 6\"/>\n<rect x=\"405\" y=\"120\" width=\"270\" height=\"52\" rx=\"4\" fill=\"#e0e7ff\" stroke=\"#334155\"/>\n<text x=\"540\" y=\"152\" "15\" text-anchor=\"middle\" fill=\"#475569\">10 si PuntoComun; 50 si SuperPunto<\/text>\n<rect x=\"84\" y=\"1250\" width=\"1732\" height=\"38\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n<text x=\"98\" y=\"1274\" font-size=\"16\" fill=\"#475569\">Partida: puntaje += valor. Si es SuperPunto, asusta a los fantasmas (R5).<\/text>\n<polyline points=\"180,1395 262,1395 262,1417 180,1417\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\"/>\n<polygon points=\"190.0,1421.5 180,1417 190.0,1412.5\" fill=\"#334155\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"191\" y=\"1368\" width=\"163.9\" height=\"22\" fill=\"white\"/>\n<text x=\"195\" y=\"1385\" font-size=\"15\" text-anchor=\"start\" fill=\"#0f172a\">comprobarVictoria()<\/text>\n<rect x=\"48\" y=\"1442\" width=\"1804\" height=\"60\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n<text x=\"62\" y=\"1466\" font-size=\"16\" fill=\"#475569\">El consumo ocurre antes de mover y de resolver colisiones. Un último punto gana inmediatamente (R9); si continúa, se procesa<\/text>\n<text x=\"62\" y=\"1488\" font-size=\"16\" fill=\"#475569\">R4/R7.<\/text>\n<text x=\"40\" y=\"1596\" font-size=\"14\" fill=\"#64748b\">Código: src/ · R01–R10 según Requerimientos TPO PacMan 1.md · Elaboración asistida por IA<\/text>\n<\/g><\/svg>", "details": "Fuentes: Partida.actualizar, Partida.consumir, Laberinto.obtenerCelda, Celda.retirarPunto, PuntoComun.valor, SuperPunto.valor. Las flechas son llamadas o retornos; las cajas de texto son operaciones locales o resúmenes. Los fragmentos alt/opt/loop corresponden a condiciones y repeticiones del código. Las partes omitidas de actualizar() se indican expresamente. No se añaden métodos de diseño."}, {"id": "R04", "title": "R04 · Enemigos", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1420\" height=\"2056\" viewBox=\"0 0 1420 2056\" role=\"img\" aria-label=\"R04 - Enemigos\">\n<defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHei />\n<text x=\"62\" y=\"1790\" font-size=\"16\" fill=\"#475569\">Se detectan colisiones, se mueve y se resuelven contactos. Un asustado puede ser comido en este mismo tick (R6).<\/text>\n<rect x=\"30\" y=\"1818\" width=\"1840\" height=\"212\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"1.5\"/>\n<path d=\"M30 1818h65v22l-10 8h-55z\" fill=\"#e2e8f0\" stroke=\"#64748b\"/>\n<text x=\"40\" y=\"1839\" font-size=\"16\" font-weight=\"bold\">loop<\/text>\n<rect x=\"38\" y=\"1854\" width=\"366.40000000000003\" height=\"22\" fill=\"white\"/>\n<text x=\"42\" y=\"1871\" font-size=\"15\" text-anchor=\"start\" fill=\"#334155\">[fin del tick del superpunto: cada fantasma]<\/text>\n<polyline points=\"180,1917 900,1917\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\"/>\n<polygon points=\"890.0,1912.5 900,1917 890.0,1921.5\" fill=\"#334155\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"458.05\" y=\"1890\" width=\"163.9\" height=\"22\" fill=\"white\"/>\n<text x=\"540.0\" y=\"1907\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0f172a\">actualizarEstado(0)<\/text>\n<rect x=\"66\" y=\"1948\" width=\"1768\" height=\"38\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n<text x=\"80\" y=\"1972\" font-size=\"16\" fill=\"#475569\">tiempoADescontar = sustoRenovado ? 0 : tiempoTranscurrido. Conserva los 10 segundos si sigue ASUSTADO.<\/text>\n<rect x=\"30\" y=\"2030\" width=\"1840\" height=\"212\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"1.5\"/>\n<path d=\"M30 2030h65v22l-10 8h-55z\" fill=\"#e2e8f0\" stroke=\"#64748b\"/>\n<text x=\"40\" y=\"2051\" font-size=\"16\" font-weight=\"bold\">loop<\/text>\n<rect x=\"38\" y=\"2066\" width=\"625.6\" height=\"22\" fill=\"white\"/>\n<text x=\"42\" y=\"2083\" font-size=\"15\" text-anchor=\"start\" fill=\"#334155\">[ticks siguientes sin nuevo superpunto, sin muerte y mientras siga ASUSTADO]<\/text>\n<polyline points=\"180,2129 900,2129\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\"/>\n<polygon points=\"890.0,2124.5 900,2129 890.0,2133.5\" fill=\"#334155\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"389.2\" y=\"2102\" width=\"301.6\" height=\"22\" fill=\"white\"/>\n<text x=\"540.0\" y=\"2119\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0f172a\">actualizarEstado(tiempoTranscurrido)<\/text>\n<rect x=\"66\" y=\"2160\" width=\"1768\" height=\"38\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n<text x=\"80\" y=\"2184\" font-size=\"16\" fill=\"#475569\">Resta tiempoTranscurrido; con tiempoSustoRestante &lt;= 1e-9, fija 0 y pasa a PERSIGUIENDO.<\/text>\n<text x=\"40\" y=\"2322\" font-size=\"14\" fill=\"#64748b\">Código: src/ · R01–R10 según Requerimientos TPO PacMan 1.md · Elaboración asistida por IA<\/text>\n<\/g><\/svg>", "details": "Fuentes: Partida.consumir, Partida.actualizar, SuperPunto.valor, Fantasma.asustar, Fantasma.elegirDireccion, Fantasma.actualizarEstado, Laberinto.direccionesDisponibles. Las flechas son llamadas o retornos; las cajas de texto son operaciones locales o resúmenes. Los fragmentos alt/opt/loop corresponden a condiciones y repeticiones del código. Las partes omitidas de actualizar() se indican expresamente. No se añaden métodos de diseño."}, {"id": "R06", "title": "R06 · Consumo de fantasmas", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1420\" height=\"1946\" viewBox=\"0 0 1420 1946\" role=\"img\" aria-label=\"R06 - Consumo de fantasmas\">\n<defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#334155\"/><\/marker><marker id=\"open\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"9\" markerHeight=\"9\" orient=\"auto-start-reverse\"><path d=\"M1 1L11 6L1 11\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"1.5\"/><\/marker><marker id=\"triangle\" viewBox=\"0 0 14 14\" refX=\"13\" refY=\"7\" markerWidth=\"15\" markerHeight=\"15\" orient=\"auto-start-reverse\"><path d=\"M1 1L13 7L1 13Z\" fill=\"white\" stroke=\"#334155\"/><\/marker><marker id=\"diamond\" viewBox=\"0 0 18 12\" refX=\"1\" refY=\"6\" markerWidth=\"18\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L9 1L17 6L9 11Z\" fill=\"#334155\" stroke=\"#334155\"/><\/marker><\/defs>\n<rect width=\"1420\" height=\"1946\" fill=\"#ffffff\"/>\n<g font-family=\"Arial, sans-serif\" fill=\"#0f172a\">\n<text x=\"40\" y=\"46\" font-size=\"27\" font-weight=\"bold\">R06 · CONSUMO DE FANTASMAS<\/text>\n<text x=\"40\" y=\"80\" font-size=\"16\" fill=\"#475569\">Llamadas reales del código · notas para asignaciones y partes omitidas · lectura de arriba hacia abajo<\/text>\n<rect x=\"45\" y=\"120\" width=\"270\" height=\"52\" rx=\"4\" fill=\"#dcfce7\" stroke=\"#334155\"/>\n<text x=\"180\" y=\"152\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"bold\">partida:Partida<\/text>\n<path d=\"M180 172V1891\" stroke=\"#94a3b8\" stroke-dasharray=\"7 6\"/>\n<rect x=\"405\" y=\"120\" width=\"270\" height=\"52\" rx=\"4\" fill=\"#dcfce7\" stroke=\"#334155\"/>\n<text x=\"540\" y=\"152\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"bold\">fantasma:Fantasma<\/text>\n<path d=\"M540 172V1891\" stroke=\"#94a3b8\" stroke-dasharray=\"7 6\"/>\n<rect x=\"765\" y=\"120\" width=\"270\" height=\"52\" rx=\"4\" fill=\"#dcfce7\" stroke=\"#334155\"/>\n<text x=\"900\" y=\"152\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"bold\">lab:Laberinto<\/text>\n<path d=\"M900 172V1891\" stroke=\"#94a3b8\" stroke-dasharray=\"7 6\"/>\n<rect x=\"48\" y=\"230\" width=\"1324\" height=\"60\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n<text x=\"62\" y=\"254\" font-size=\"16\" fill=\"#475569\">Precondición: detectarColision() encontró un fantasma ASUSTADO. Partida ya movió a los personajes y recorre los contactos<\/text>\n<text x=\"62\" y=\"276\" font-size=\"16\" fill=\"#475569\">(R7).<\/text>\n<polyline points=\"180,337 540,337\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\"/>\n<polygon points=\"530.0,332.5 540,337 530.0,341.5\" fill=\"#334155\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"310.45\" y=\"310\" width=\"99.10000000000001\" height=\"22\" fill=\"white\"/>\n<text x=\"360.0\" y=\"327\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0f172a\">getEstado()<\/text>\n<polyline points=\"540,401 180,401\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\"/>\n<polyline points=\"190.0,405.5 180,401 190.0,396.5\" fill=\"none\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"322.6\" y=\"374\" width=\"74.80000000000001\" height=\"22\" fill=\"white\"/>\n<text x=\"360.0\" y=\"391\" font-size=\"15\" text-anchor=\"middle\" fill=\"#475569\">ASUSTADO<\/text>\n<polyline points=\"180,465 262,465 262,487 180,487\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\"/>\n<polygon points=\"190.0,491.5 180,487 190.0,482.5\" fill=\"#334155\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"191\" y=\"438\" width=\"220.60000000000002\" height=\"22\" fill=\"white\"/>\n<text x=\"195\" y=\"455\" font-size=\"15\" text-anchor=\"start\" fill=\"#0f172a\">resolverColision(fantasma)<\/text>\n<polyline points=\"180,545 540,545\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\"/>\n<polygon points=\"530.0,540.5 540,545 530.0,549.5\" fill=\"#334155\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"310.45\" y=\"518\" width=\"99.10000000000001\" height=\"22\" fill=\"white\"/>\n<text x=\"360.0\" y=\"535\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0f172a\">getEstado()<\/text>\n<rect x=\"48\" y=\"576\" width=\"1324\" height=\"38\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n<text x=\"62\" y=\"600\" font-size=\"16\" fill=\"#475569\">Partida suma 200 puntos por este fantasma.<\/text>\n<polyline points=\"180,661 540,661\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\"/>\n<polygon points=\"530.0,656.5 540,661 530.0,665.5\" fill=\"#334155\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"310.45\" y=\"634\" width=\"99.10000000000001\" height=\"22\" fill=\"white\"/>\n<text x=\"360.0\" y=\"651\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0f172a\">serComido()<\/text>\n<rect x=\"48\" y=\"692\" width=\"1324\" height=\"38\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n<text x=\"62\" y=\"716\" font-size=\"16\" fill=\"#475569\">Si está ASUSTADO: estado = REGRESANDO; tiempoSustoRestante = 0. En otro estado serComido() retorna sin cambios.<\/text>\n<rect x=\"48\" y=\"744\" width=\"1324\" height=\"38\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n<text x=\"62\" y=\"768\" font-size=\"16\" fill=\"#475569\">Este proceso se repite por cada asustado tocado. Si además hay un perseguidor, se cobran todos antes de perder la vida (R7).<\/text>\n<rect x=\"30\" y=\"796\" width=\"1360\" height=\"212\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"1.5\"/>\n<path d=\"M30 796h65v22l-10 8h-55z\" fill=\"#e2e8f0\" stroke=\"#64748b\"/>\n<text x=\"40\" y=\"817\" font-size=\"16\" font-weight=\"bold\">opt<\/text>\n<rect x=\"38\" y=\"832\" width=\"236.8\" height=\"22\" fill=\"white\"/>\n<text x=\"42\" y=\"849\" font-size=\"15\" text-anchor=\"start\" fill=\"#334155\">[no hubo contacto peligroso]<\/text>\n<polyline points=\"180,895 540,895\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\"/>\n<polygon points=\"530.0,890.5 540,895 530.0,899.5\" fill=\"#334155\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"217.29999999999998\" y=\"868\" width=\"285.40000000000003\" height=\"22\" fill=\"white\"/>\n<text x=\"360.0\" y=\"885\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0f172a\">actualizarEstado(tiempoADescontar)<\/text>\n<rect x=\"66\" y=\"926\" width=\"1288\" height=\"38\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n<text x=\"80\" y=\"950\" font-size=\"16\" fill=\"#475569\">Puede volver a PERSIGUIENDO ya en este tick si fue comido sobre su posición inicial.<\/text>\n<rect x=\"30\" y=\"1008\" width=\"1360\" height=\"838\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"1.5\"/>\n<path d=\"M30 1008h65v22l-10 8h-55z\" fill=\"#e2e8f0\" stroke=\"#64748b\"/>\n<text x=\"40\" y=\"1029\" font-size=\"16\" font-weight=\"bold\">loop<\/text>\n<rect x=\"38\" y=\"1044\" width=\"552.7\" height=\"22\" fill=\"white\"/>\n<text x=\"42\" y=\"1061\" font-size=\"15\" text-anchor=\"start\" fill=\"#334155\">[ticks siguientes: continúa REGRESANDO y la partida sigue en curso]<\/text>\n<polyline points=\"180,1107 540,1107\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\"/>\n<polygon points=\"530.0,1102.5 540,1107 530.0,1111.5\" fill=\"#334155\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"156.54999999999998\" y=\"1080\" width=\"406.90000000000003\" height=\"22\" fill=\"white\"/>\n<text x=\"360.0\" y=\"1097\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0f172a\">elegirDireccion(laberinto, proximaPosicionPacMan)<\/text>\n<polyline points=\"540,1171 900,1171\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\"/>\n<polygon points=\"890.0,1166.5 900,1171 890.0,1175.5\" fill=\"#334155\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"548.95\" y=\"1144\" width=\"342.1\" height=\"22\" fill=\"white\"/>\n<text x=\"720.0\" y=\"1161\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0f172a\">caminoMasCorto(posicion, posicionInicial)<\/text>\n<polyline points=\"900,1235 540,1235\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\"/>\n<polyline points=\"550.0,1239.5 540,1235 550.0,1230.5\" fill=\"none\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"621.85\" y=\"1208\" width=\"196.3\" height=\"22\" fill=\"white\"/>\n<text x=\"720.0\" y=\"1225\" font-size=\"15\" text-anchor=\"middle\" fill=\"#475569\">camino al origen propio<\/text>\n<polyline points=\"540,1299 180,1299\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\"/>\n<polyline points=\"190.0,1303.5 180,1299 190.0,1294.5\" fill=\"none\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"221.35\" y=\"1272\" width=\"277.3\" height=\"22\" fill=\"white\"/>\n<text x=\"360.0\" y=\"1289\" font-size=\"15\" text-anchor=\"middle\" fill=\"#475569\">dirección al próximo paso, o null<\/text>\n<rect x=\"66\" y=\"1330\" width=\"1288\" height=\"38\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n<text x=\"80\" y=\"1354\" font-size=\"16\" fill=\"#475569\">Partida calcula posiciones y detecta contactos antes de mover (R4/R7).<\/text>\n<polyline points=\"180,1415 540,1415\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\"/>\n<polygon points=\"530.0,1410.5 540,1415 530.0,1419.5\" fill=\"#334155\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"245.64999999999998\" y=\"1388\" width=\"228.70000000000002\" height=\"22\" fill=\"white\"/>\n<text x=\"360.0\" y=\"1405\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0f172a\">mover(direccion, laberinto)<\/text>\n<rect x=\"66\" y=\"1446\" width=\"1288\" height=\"38\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n<text x=\"80\" y=\"1470\" font-size=\"16\" fill=\"#475569\">Al resolver contactos, REGRESANDO no daña a PacMan ni vuelve a dar 200 puntos.<\/text>\n<polyline points=\"180,1531 540,1531\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\"/>\n<polygon points=\"530.0,1526.5 540,1531 530.0,1535.5\" fill=\"#334155\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"217.29999999999998\" y=\"1504\" width=\"285.40000000000003\" height=\"22\" fill=\"white\"/>\n<text x=\"360.0\" y=\"1521\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0f172a\">actualizarEstado(tiempoADescontar)<\/text>\n<rect x=\"47\" y=\"1562\" width=\"1326\" height=\"254\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"1.5\"/>\n<path d=\"M47 1562h65v22l-10 8h-55z\" fill=\"#e2e8f0\" stroke=\"#64748b\"/>\n<text x=\"57\" y=\"1583\" font-size=\"16\" font-weight=\"bold\">alt<\/text>\n<rect x=\"55\" y=\"1598\" width=\"398.8\" height=\"22\" fill=\"white\"/>\n<text x=\"59\" y=\"1615\" font-size=\"15\" text-anchor=\"start\" fill=\"#334155\">[posicion == posicionInicial por fila y columna]<\/text>\n<path d=\"M47 1698H1373\" stroke=\"#94a3b8\" stroke-dasharray=\"7 5\"/>\n<rect x=\"55\" y=\"1704\" width=\"155.8\" height=\"22\" fill=\"white\"/>\n<text x=\"59\" y=\"1721\" font-size=\"15\" text-anchor=\"start\" fill=\"#334155\">[todavía no llegó]<\/text>\n<rect x=\"84\" y=\"1628\" width=\"1252\" height=\"38\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n<text x=\"98\" y=\"1652\" font-size=\"16\" fill=\"#475569\">tiempoSustoRestante = 0; estado = PERSIGUIENDO. Perseguirá a PacMan en el siguiente tick.<\/text>\n<rect x=\"84\" y=\"1734\" width=\"1252\" height=\"38\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n<text x=\"98\" y=\"1758\" font-size=\"16\" fill=\"#475569\">Conserva REGRESANDO. Si no hay camino, queda quieto.<\/text>\n<text x=\"40\" y=\"1926\" font-size=\"14\" fill=\"#64748b\">Código: src/ · R01–R10 según Requerimientos TPO PacMan 1.md · Elaboración asistida por IA<\/text>\n<\/g><\/svg>", "details": "Fuentes: Partida.actualizar, Partida.resolverColision, Fantasma.serComido, Fantasma.elegirDireccion, Fantasma.mover, Fantasma.actualizarEstado. Las flechas son llamadas o retornos; las cajas de texto son operaciones locales o resúmenes. Los fragmentos alt/opt/loop corresponden a condiciones y repeticiones del código. Las partes omitidas de actualizar() se indican expresamente. No se añaden métodos de diseño."}, {"id": "R07", "title": "R07 · Muerte de PacMan", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1420\" height=\"2570\" viewBox=\"0 0 1420 2570\" role=\"img\" aria-label=\"R07 - Muerte de PacMan\">\n<defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#334155\"/><\/marker><marker id=\"open\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"9\" markerHeight=\"9\" orient=\"auto-start-reverse\"><path d=\"M1 1L11 6L1 11\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"1.5\"/><\/marker><marker id=\"triangle\" viewBox=\"0 0 14 14\" refX=\"13\" refY=\"7\" markerWidth=\"15 nicial y fija direccion = DERECHA.<\/text>\n<rect x=\"47\" y=\"2176\" width=\"1326\" height=\"212\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"1.5\"/>\n<path d=\"M47 2176h65v22l-10 8h-55z\" fill=\"#e2e8f0\" stroke=\"#64748b\"/>\n<text x=\"57\" y=\"2197\" font-size=\"16\" font-weight=\"bold\">loop<\/text>\n<rect x=\"55\" y=\"2212\" width=\"131.5\" height=\"22\" fill=\"white\"/>\n<text x=\"59\" y=\"2229\" font-size=\"15\" text-anchor=\"start\" fill=\"#334155\">[cada fantasma]<\/text>\n<polyline points=\"180,2275 900,2275\" stroke=\"#334155\" fill=\"none\" stroke-width=\"1.5\"/>\n<polygon points=\"890.0,2270.5 900,2275 890.0,2279.5\" fill=\"#334155\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n<rect x=\"470.2\" y=\"2248\" width=\"139.60000000000002\" height=\"22\" fill=\"white\"/>\n<text x=\"540.0\" y=\"2265\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0f172a\">volverAlInicio()<\/text>\n<rect x=\"84\" y=\"2306\" width=\"1252\" height=\"38\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n<text x=\"98\" y=\"2330\" font-size=\"16\" fill=\"#475569\">Copia su origen propio; estado = PERSIGUIENDO; tiempoSustoRestante = 0.<\/text>\n<rect x=\"66\" y=\"2388\" width=\"1288\" height=\"38\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n<text x=\"80\" y=\"2412\" font-size=\"16\" fill=\"#475569\">Si vidas == 0: DERROTA (R8). actualizar() retorna antes de actualizar temporizadores. Conserva puntaje y puntos retirados.<\/text>\n<text x=\"40\" y=\"2550\" font-size=\"14\" fill=\"#64748b\">Código: src/ · R01–R10 según Requerimientos TPO PacMan 1.md · Elaboración asistida por IA<\/text>\n<\/g><\/svg>", "details": "Fuentes: Partida.actualizar, Partida.detectarColision, Partida.resolverColision, Partida.perderVida, PacMan.volverAlInicio, Fantasma.volverAlInicio. Las flechas son llamadas o retornos; las cajas de texto son operaciones locales o resúmenes. Los fragmentos alt/opt/loop corresponden a condiciones y repeticiones del código. Las partes omitidas de actualizar() se indica
